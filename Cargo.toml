[package]
name = "session-guard"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
description = "Stolen session cookies become useless: rotating tokens with reuse detection and risk-based step-up for Rust web apps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/A-Line-Services/session-guard"
documentation = "https://docs.rs/session-guard"
readme = "README.md"
keywords = ["session", "authentication", "security", "axum", "cookie"]
categories = ["authentication", "web-programming", "web-programming::http-server"]
autoexamples = false
include = ["build.rs", "src/**/*", "migrations/**/*", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
## Tower layer, `AuthSession` and `Sessions` extractors and response impls for axum 0.8.
axum = ["tokio", "dep:axum", "dep:http", "dep:tower-layer", "dep:tower-service"]
## PostgreSQL store (sqlx, runtime queries, embedded migrations).
postgres = ["dep:sqlx"]
## Valkey / Redis store with atomic Lua rotation.
valkey = ["dep:redis"]
## MaxMind GeoLite2 / GeoIP2 country + ASN lookups with hot reload.
maxmind = ["dep:maxminddb", "dep:arc-swap"]
## Counters per decision, signal and event via the `metrics` facade.
metrics = ["dep:metrics"]
## `Guard::spawn_purge` on the tokio runtime.
tokio = ["dep:tokio"]
## OpenAPI support through `aide` (and so `rovo`): the `session_cookie` security scheme.
aide = ["axum", "dep:aide"]
## `store_conformance!` suite and test helpers for custom store implementations.
testing = []

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
getrandom = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
quick_cache = "0.7.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
woothee = "0.13.0"
zeroize = "1.9.1"

aide = { version = "0.15.1", default-features = false, optional = true }
arc-swap = { version = "1.9.2", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"], optional = true }
http = { version = "1.5.0", optional = true }
maxminddb = { version = "0.32.0", optional = true }
metrics = { version = "0.24.6", optional = true }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"], optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "uuid", "migrate", "macros", "ipnet", "json"], optional = true }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "time"], optional = true }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
session-guard = { path = ".", features = ["testing"] }
aide = { version = "0.15.1", features = ["axum", "axum-json"] }
axum = { version = "0.8.9", features = ["macros"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
http-body-util = "0.1.5"
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies"] }
rovo = { version = "0.4.12", features = ["swagger"] }
testcontainers = { version = "0.28.0", features = ["reusable-containers"] }
tokio = { version = "1.53.2", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "authenticate"
harness = false

[[test]]
name = "postgres"
required-features = ["postgres"]

[[test]]
name = "valkey"
required-features = ["valkey"]

[[test]]
name = "aide"
required-features = ["aide"]

[[test]]
name = "axum"
required-features = ["axum"]

[[test]]
name = "e2e"
required-features = ["axum", "postgres", "valkey"]

[lints]
workspace = true

[workspace]
members = ["examples"]
exclude = ["fuzz"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
