[package]
name = "session-guard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ipnet = "2.12.2"
libfuzzer-sys = "0.4.13"
serde_json = "1.0.152"
session-guard = { path = "..", features = ["testing"] }

# Not part of the main package's workspace.
[workspace]
members = ["."]

[[bin]]
name = "cookie"
path = "fuzz_targets/cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xff"
path = "fuzz_targets/xff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "user_agent"
path = "fuzz_targets/user_agent.rs"
test = false
doc = false
bench = false
