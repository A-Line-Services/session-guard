name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check llms-full.txt is up to date
        run: ./scripts/gen-llms-full.sh --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      # The fuzz crate is outside the workspace and only fuzzed weekly.
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.94"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.toolchain }}
      - name: Test
        if: matrix.toolchain == 'stable'
        run: cargo test --features axum,maxmind,metrics,testing
      - name: Doc tests
        if: matrix.toolchain == 'stable'
        run: cargo test --doc --all-features
      - name: Build examples
        if: matrix.toolchain == 'stable'
        run: cargo build -p examples
      - name: Example tests
        if: matrix.toolchain == 'stable'
        run: cargo test -p examples
      # Tests need Docker services, so the MSRV row only compiles everything
      # (library, tests, examples, benches) and the library without features.
      - name: Check MSRV
        if: matrix.toolchain != 'stable'
        run: |
          cargo check --workspace --all-features --all-targets
          cargo check --no-default-features --lib

  integration:
    name: integration (postgres, valkey, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests start testcontainers by default, but use these services
    # instead when DATABASE_URL / VALKEY_URL / VALKEY_CLUSTER_URL are set.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      VALKEY_URL: redis://localhost:6379
      VALKEY_CLUSTER_URL: redis://127.0.0.1:7000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Three masters on the host network, so redirects between nodes are exercised.
      - name: Start Valkey Cluster
        run: |
          for port in 7000 7001 7002; do
            docker run -d --name "valkey-$port" --network host valkey/valkey:8 \
              valkey-server --port "$port" --cluster-enabled yes \
              --cluster-announce-ip 127.0.0.1 --cluster-config-file "/tmp/nodes-$port.conf" --save ''
          done
          sleep 3
          docker exec valkey-7000 valkey-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
          until docker exec valkey-7000 valkey-cli -p 7000 cluster info | grep -q cluster_state:ok; do sleep 1; done
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-features --test postgres --test valkey --test valkey_cluster --test e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload via OIDC, so no token secret.
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      VALKEY_URL: redis://localhost:6379
      VALKEY_CLUSTER_URL: redis://127.0.0.1:7000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Three masters on the host network, so redirects between nodes are exercised.
      - name: Start Valkey Cluster
        run: |
          for port in 7000 7001 7002; do
            docker run -d --name "valkey-$port" --network host valkey/valkey:8 \
              valkey-server --port "$port" --cluster-enabled yes \
              --cluster-announce-ip 127.0.0.1 --cluster-config-file "/tmp/nodes-$port.conf" --save ''
          done
          sleep 3
          docker exec valkey-7000 valkey-cli --cluster create \
            127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
          until docker exec valkey-7000 valkey-cli -p 7000 cluster info | grep -q cluster_state:ok; do sleep 1; done
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          # Fork PRs get no OIDC token and upload tokenless instead.
          use_oidc: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  hack:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hack
      # Every feature pair (43 builds) instead of the full powerset (256):
      # features are additive, so wider combinations add little.
      - run: cargo hack check --feature-powerset --depth 2 --no-dev-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo package --locked
