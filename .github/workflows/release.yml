name: Weekly Release
run-name: weekly-release

on:
  schedule:
    # Every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Force release even without code changes
        type: boolean
        default: false
      include_ci_changes:
        description: Include .github/ changes in release check
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes since last release
        id: check
        env:
          FORCE: ${{ inputs.force }}
          INCLUDE_CI: ${{ inputs.include_ci_changes }}
        run: |
          if [ "$FORCE" == "true" ]; then
            echo "Force release requested"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found, proceeding with release"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last release tag: $LAST_TAG"

          # Files changed since the last release, ignoring version bump commits
          CHANGED_FILES=$(git log "${LAST_TAG}..HEAD" --grep="chore(release):" --invert-grep --name-only --pretty=format: | sort -u | grep -v '^$' || echo "")
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed since last release"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Files changed since $LAST_TAG:"
          echo "$CHANGED_FILES"

          if [ "$INCLUDE_CI" != "true" ]; then
            RELEASE_FILES=$(echo "$CHANGED_FILES" | grep -v '^\.github/' || echo "")
          else
            RELEASE_FILES="$CHANGED_FILES"
            echo "(including .github/ changes due to manual override)"
          fi

          if [ -n "$RELEASE_FILES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Release needed - found changes outside .github/"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No release needed - only .github/ changes detected"
          fi

  release:
    name: Release
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      skipped: ${{ steps.release.outputs.skipped }}
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.A_LINE_CD_APP_ID }}
          private-key: ${{ secrets.A_LINE_CD_TOKEN }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}
          # release-pilot pushes the release commit and tag with this token.
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test --features axum,maxmind,metrics,testing

      - name: Release with release-pilot
        id: release
        uses: a-line-services/release-pilot@04a84a73c027b94ff0cfbf04a22a1acd63595c8c # v1
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          cargo-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  no-release:
    name: No Release Needed
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No changes detected since last release. Skipping release."
